models:
  - name: int_orders
    latest_version: 1
    config:
      contract:
        enforced: true
      access: public
      group: finance        
    columns:
      - name: order_id
        data_type: number(20,2)
        constraints:
          - type: not_null
        tests:
          - unique:
              config:
                severity: warn
                error_if: ">100"
                warn_if: ">10"
                store_failures: true
      - name: customer_id
        data_type: number(20,2)
      - name: order_placed_at
        data_type: date
      - name: order_status
        data_type: varchar
        tests:
          - not_null:
              config:
                limit: 10
                store_failures: true
      - name: total_amount_paid
        data_type: number(20,2)
      - name: payment_finalized_date
        data_type: date
    versions:
      - v: 1
        config:
          alias: int_orders_v1
      - v: 2
        columns:
          - name: order_amount
            data_type: number(20,2)
          - name: latest_order_placed
            data_type: date
          - include: all
            exclude: [total_amount_paid]